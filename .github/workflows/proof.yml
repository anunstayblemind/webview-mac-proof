name: proof

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Machine
        run: |
          sw_vers
          uname -m
          python --version
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: How long does the host-name lookup take here
        run: |
          python - <<'PY'
          import socket, time
          a = time.time(); r = socket.getfqdn("127.0.0.1"); print("127.0.0.1 ->", r, round(time.time() - a, 2), "s")
          PY
      - name: Build the app with PyInstaller
        run: pyinstaller --noconfirm --windowed --name proof --add-data "web:web" app.py
      # "fast" = the built-in page server with the slow host-name lookup taken out. These decide the job.
      - name: App, page server without the lookup, run 1
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-fast1.json" visible server-fast
      - name: App, page server without the lookup, run 2
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-fast2.json" visible server-fast
      - name: App, page server without the lookup, run 3
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-fast3.json" visible server-fast
      - name: App, strict content policy (no eval), without the lookup
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-csp-fast.json" visible csp-fast
      - name: App, same policy but eval allowed, without the lookup
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-csp-eval-fast.json" visible csp-eval-fast
      - name: App, page from a file (no page server)
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-file.json" visible file
      - name: From source, page server without the lookup
        continue-on-error: true
        run: python app.py "$PWD/result-source-fast.json" visible server-fast
      - name: For the record, the app with the lookup left in (expected slow or failing here)
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-slow-lookup.json" visible server
      - name: Size and signature of the built app
        if: always()
        run: |
          du -sh dist/proof.app
          codesign -dv dist/proof.app 2>&1 | head -8 || true
          ditto -c -k --keepParent dist/proof.app proof-app.zip
      - name: Results
        if: always()
        run: python show.py result-app-fast1.json result-app-fast2.json result-app-fast3.json result-app-csp-fast.json result-app-csp-eval-fast.json result-app-file.json result-source-fast.json result-slow-lookup.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proof-${{ matrix.os }}
          retention-days: 3
          path: |
            result-*.json
            proof-app.zip
