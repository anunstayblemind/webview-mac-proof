name: proof

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Machine
        run: |
          sw_vers
          uname -m
          python --version
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: How long do host-name lookups take here
        run: |
          python - <<'PY'
          import socket, time
          for n in ("", "127.0.0.1", "localhost"):
              a = time.time(); r = socket.getfqdn(n); print(repr(n), "->", r, round(time.time() - a, 2), "s")
          PY
      - name: Run from source, first time on this machine (a real window)
        continue-on-error: true
        run: python app.py "$PWD/result-source.json" visible
      - name: Run from source again
        continue-on-error: true
        run: python app.py "$PWD/result-source2.json" visible
      - name: Run from source, page from a file instead of the built-in server
        continue-on-error: true
        run: python app.py "$PWD/result-source-file.json" visible file
      - name: Build the app with PyInstaller
        run: pyinstaller --noconfirm --windowed --name proof --add-data "web:web" app.py
      - name: Run the built app (a real window)
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app.json" visible
      - name: Run the built app again
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app2.json" visible
      - name: Run the built app, page from a file instead of the built-in server
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-file.json" visible file
      - name: Run the built app, page with a strict content policy (no eval)
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-csp.json" visible csp
      - name: Run the built app, same policy but eval allowed
        continue-on-error: true
        run: dist/proof.app/Contents/MacOS/proof "$PWD/result-app-csp-eval.json" visible csp-eval
      - name: Size and signature of the built app
        if: always()
        run: |
          du -sh dist/proof.app
          codesign -dv dist/proof.app 2>&1 | head -8 || true
          ditto -c -k --keepParent dist/proof.app proof-app.zip
      - name: Results
        if: always()
        run: python show.py result-source.json result-source2.json result-source-file.json result-app.json result-app2.json result-app-file.json result-app-csp.json result-app-csp-eval.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proof-${{ matrix.os }}
          retention-days: 3
          path: |
            result-source.json
            result-source2.json
            result-app.json
            result-app2.json
            result-source-file.json
            result-app-file.json
            result-app-csp.json
            result-app-csp-eval.json
            proof-app.zip
